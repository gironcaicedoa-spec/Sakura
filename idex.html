<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Napoletana | Chatbot Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f0f0f; color: #f5f5f5; }
        .pizza-gradient { background: linear-gradient(135deg, #7f1d1d, #1f1f1f); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-[#0a0a0a]">
        <header class="p-6 border-b border-white/10 glass flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tighter text-red-500">PIZZA NAPOLETANA</h1>
            <div class="flex items-center gap-2"><span class="animate-pulse w-2 h-2 rounded-full bg-green-500"></span><span class="text-xs opacity-70">Online</span></div>
        </header>
        
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="glass p-4 rounded-2xl max-w-[80%] text-sm">¡Hola! Bienvenido a la mejor pizzería artesanal. ¿Qué te gustaría pedir hoy?</div>
        </div>

        <form id="chat-form" class="p-6 glass">
            <div class="flex gap-3">
                <input type="text" id="user-input" class="flex-1 bg-white/5 border border-white/10 rounded-xl p-3 focus:outline-none focus:border-red-500" placeholder="Ej: Quiero una pizza Pepperoni...">
                <button type="submit" class="bg-red-600 px-6 py-2 rounded-xl font-bold hover:bg-red-700 transition">Enviar</button>
            </div>
        </form>
    </main>

    <!-- Sidebar Cart -->
    <aside class="w-full md:w-96 glass p-6 flex flex-col">
        <h2 class="text-xl font-bold mb-6 text-red-500">Tu Pedido</h2>
        <div id="cart-list" class="flex-1 overflow-y-auto space-y-4 text-sm"></div>
        <div class="mt-6 pt-6 border-t border-white/10">
            <div class="flex justify-between text-lg font-bold"><span>Total:</span><span id="total-price">$0.00</span></div>
            <button onclick="finalizarPedido()" class="w-full mt-6 bg-amber-600 hover:bg-amber-700 py-3 rounded-xl font-bold transition">Confirmar Pedido</button>
        </div>
    </aside>

    <script>
        const MENU = [
            { name: "Margarita", price: 12.00 },
            { name: "Pepperoni", price: 14.50 },
            { name: "Quattro Formaggi", price: 16.00 }
        ];
        let cart = [];

        async function sendMessage(text) {
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="text-right"><span class="inline-block bg-red-900/50 p-3 rounded-2xl">${text}</span></div>`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Eres un experto pizzaiolo. Responde siempre en formato JSON puro.
                        - Si el usuario pide pizza, agrégala al carrito (cartActions: [{action: 'add', itemName: '...'}]).
                        - Si faltan datos de facturación (Nombre, Cédula, Celular, Dirección), pídelos.
                        - Si el usuario parece un robot o spam, no respondas.
                        - Datos actuales del carrito: ${JSON.stringify(cart)}.
                        Mensaje del usuario: ${text}` }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const raw = await response.json();
                const jsonText = raw.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const data = JSON.parse(jsonText);

                chat.innerHTML += `<div class="glass p-4 rounded-2xl max-w-[80%] text-sm">${data.message || "Pedido procesado."}</div>`;
                
                if(data.cartActions) {
                    data.cartActions.forEach(a => {
                        const item = MENU.find(m => m.name === a.itemName);
                        if(item) cart.push(item);
                    });
                    updateCartUI();
                }
            } catch (e) {
                chat.innerHTML += `<div class="text-red-400">Error de conexión. Intenta nuevamente.</div>`;
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            list.innerHTML = cart.map(i => `<div class="flex justify-between p-2 glass rounded-lg"><span>${i.name}</span><span>$${i.price.toFixed(2)}</span></div>`).join('');
            document.getElementById('total-price').innerText = '$' + cart.reduce((a,b) => a + b.price, 0).toFixed(2);
        }

        document.getElementById('chat-form').onsubmit = (e) => {
            e.preventDefault();
            const inp = document.getElementById('user-input');
            if(!inp.value) return;
            sendMessage(inp.value);
            inp.value = '';
        };

        function finalizarPedido() {
            if(cart.length === 0) return alert("Tu carrito está vacío.");
            alert("Pedido enviado a cocina. ¡Gracias!");
        }
    </script>
</body>
</html>
